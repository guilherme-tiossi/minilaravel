services:
  app:
    image: minilaravel
    build: .
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www/html
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
      
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass redis-pass --databases 16
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis-pass", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data: